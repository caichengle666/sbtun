name: Windows TUN 自动测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tun-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tun:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 检查 Windows 环境与管理员权限
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw '需要管理员权限' }

      - name: 下载最新 sing-box
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Accept = 'application/vnd.github+json'; Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'sbtun-tun-test' }
          $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/SagerNet/sing-box/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -match 'windows-amd64\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw '未找到 sing-box Windows 资产' }
          $zip = "$env:RUNNER_TEMP\sing-box.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\sing-box" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\sing-box" -Filter sing-box.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw '未找到 sing-box.exe' }
          "SINGBOX=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8
          & $exe.FullName version

      - name: 准备并启动真实 TUN
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\sbtun-tun-test"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          @'
          {"log":{"level":"trace","timestamp":true},"inbounds":[{"type":"tun","tag":"tun-test","address":["172.19.0.1/30"],"auto_route":false,"strict_route":false,"stack":"gvisor"}],"outbounds":[{"type":"direct","tag":"direct"}],"route":{"auto_detect_interface":true,"final":"direct"}}
          '@ | Set-Content "$dir\config.json" -Encoding utf8
          & $env:SINGBOX check -c "$dir\config.json"
          if ($LASTEXITCODE -ne 0) { throw '配置检查失败' }
          $proc = Start-Process -FilePath $env:SINGBOX -ArgumentList @('run','-c',"$dir\config.json") -WorkingDirectory $dir -RedirectStandardOutput "$dir\sing-box.log" -RedirectStandardError "$dir\sing-box.err" -PassThru
          "SINGBOX_PID=$($proc.Id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TUN_TEST_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Start-Sleep -Seconds 4
          if ($proc.HasExited) { Get-Content "$dir\sing-box.log"; Get-Content "$dir\sing-box.err"; throw 'sing-box 启动失败' }

      - name: 检测真实 TUN 后端
        shell: pwsh
        run: |
          $found = $false
          for ($i = 0; $i -lt 20; $i++) {
            $pnp = @(Get-PnpDevice -Class Net -ErrorAction SilentlyContinue | Where-Object { $_.FriendlyName -match 'Wintun|sing-tun' -or $_.InstanceId -match 'Wintun' })
            $process = Get-Process -Name 'sing-box' -ErrorAction SilentlyContinue
            Write-Host "检测 $($i + 1): PnP=$($pnp.Count), process=$([bool]$process)"
            if ($pnp.Count -gt 0 -and $process) { $found = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $found) { Get-Content "$env:TUN_TEST_DIR\sing-box.log"; Get-Content "$env:TUN_TEST_DIR\sing-box.err"; throw '真实 TUN 后端未正确初始化' }
          Write-Host '真实 TUN 后端初始化成功。'

      - name: 检查进程并清理
        if: always()
        shell: pwsh
        run: |
          if ($env:SINGBOX_PID) { Stop-Process -Id ([int]$env:SINGBOX_PID) -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2 }
          Write-Host 'Windows TUN 自动测试结束。'
