name: Linux 构建

on:
  push:
    branches: [main]
    tags: ['v*', '0.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-amd64:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: ''

      - name: 安装 Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: 加入 Go 工具路径
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 安装前端依赖
        working-directory: frontend
        run: npm install

      - name: 下载 Go 依赖
        run: go mod download

      - name: 构建 sbtun
        run: wails build -clean -platform linux/amd64

      - name: 下载最新 sing-box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/SagerNet/sing-box/releases/latest)
          url=$(printf '%s' "$release" | jq -r '.assets[] | select(.name | test("linux-amd64.tar.gz$")) | .browser_download_url' | head -n 1)
          digest=$(printf '%s' "$release" | jq -r '.assets[] | select(.name | test("linux-amd64.tar.gz$")) | .digest' | head -n 1 | sed 's/^sha256://')
          version=$(printf '%s' "$release" | jq -r '.tag_name' | sed 's/^v//')
          test -n "$url" && test -n "$digest"
          curl -fL "$url" -o "$RUNNER_TEMP/sing-box.tar.gz"
          echo "$digest  $RUNNER_TEMP/sing-box.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sing-box"
          tar -xzf "$RUNNER_TEMP/sing-box.tar.gz" -C "$RUNNER_TEMP/sing-box"
          echo "SING_BOX_VERSION=$version" >> "$GITHUB_ENV"

      - name: 下载分流规则集
        run: |
          set -euo pipefail
          mkdir -p dist/rules
          curl -fL https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-geolocation-cn.srs -o dist/rules/geosite-geolocation-cn.srs
          curl -fL https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-geolocation-\!cn.srs -o 'dist/rules/geosite-geolocation-!cn.srs'
          curl -fL https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-cn.srs -o dist/rules/geoip-cn.srs
          sha256sum dist/rules/*.srs > dist/rules/SHA256SUMS.txt

      - name: 组装 Linux 便携版
        run: |
          set -euo pipefail
          rm -rf dist/sbtun-linux-amd64
          mkdir -p dist/sbtun-linux-amd64/resources
          cp build/bin/sbtun dist/sbtun-linux-amd64/sbtun
          sing_box=$(find "$RUNNER_TEMP/sing-box" -type f -name sing-box -executable | head -n 1)
          test -n "$sing_box"
          cp "$sing_box" dist/sbtun-linux-amd64/sing-box
          cp -r dist/rules dist/sbtun-linux-amd64/rules
          cp VERSION dist/sbtun-linux-amd64/VERSION
          cp resources/icon.png dist/sbtun-linux-amd64/resources/icon.png
          chmod +x dist/sbtun-linux-amd64/sbtun dist/sbtun-linux-amd64/sing-box
          printf 'sbtun Linux 便携版\n\n运行 ./sbtun 启动桌面程序。\nTUN 模式需要 root 或 CAP_NET_ADMIN 权限。\n\n内置 sing-box %s。\n' "$SING_BOX_VERSION" > dist/sbtun-linux-amd64/README.txt
          (cd dist/sbtun-linux-amd64 && sha256sum sbtun sing-box > SHA256SUMS.txt)

      - name: 打包 TAR.GZ
        run: tar -czf dist/sbtun-linux-amd64.tar.gz -C dist sbtun-linux-amd64

      - name: 创建并上传 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/sbtun-linux-amd64.tar.gz --clobber
          else
            gh release create "$tag" dist/sbtun-linux-amd64.tar.gz --title "sbtun $tag" --generate-notes
          fi
