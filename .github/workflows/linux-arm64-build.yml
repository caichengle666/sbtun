name: Linux ARM64 构建

on:
  push:
    branches: [main, codex/capture-linux-arm64]
    tags: ['v*', '0.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-arm64-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: ''

      - name: 安装 Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: 加入 Go 工具路径
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 安装前端依赖
        working-directory: frontend
        run: npm install

      - name: 下载 Go 依赖
        run: go mod download

      - name: 构建 sbtun
        run: wails build -clean -platform linux/arm64

      - name: 下载最新 sing-box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/SagerNet/sing-box/releases/latest)
          url=$(printf '%s' "$release" | jq -r '.assets[] | select(.name | test("linux-arm64.tar.gz$")) | .browser_download_url' | head -n 1)
          digest=$(printf '%s' "$release" | jq -r '.assets[] | select(.name | test("linux-arm64.tar.gz$")) | .digest' | head -n 1 | sed 's/^sha256://')
          version=$(printf '%s' "$release" | jq -r '.tag_name' | sed 's/^v//')
          test -n "$url" && test -n "$digest"
          curl -fL "$url" -o "$RUNNER_TEMP/sing-box.tar.gz"
          echo "$digest  $RUNNER_TEMP/sing-box.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sing-box"
          tar -xzf "$RUNNER_TEMP/sing-box.tar.gz" -C "$RUNNER_TEMP/sing-box"
          echo "SING_BOX_VERSION=$version" >> "$GITHUB_ENV"

      - name: 下载分流规则集
        run: |
          set -euo pipefail
          mkdir -p dist/rules
          download_rule() {
            local raw_url="$1"
            local fallback_url="$2"
            local output="$3"
            curl -fL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 "$raw_url" -o "$output" ||
              curl -fL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 "$fallback_url" -o "$output"
          }
          download_rule \
            https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-geolocation-cn.srs \
            https://cdn.jsdelivr.net/gh/SagerNet/sing-geosite@rule-set/geosite-geolocation-cn.srs \
            dist/rules/geosite-geolocation-cn.srs
          download_rule \
            'https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-geolocation-%21cn.srs' \
            'https://cdn.jsdelivr.net/gh/SagerNet/sing-geosite@rule-set/geosite-geolocation-%21cn.srs' \
            'dist/rules/geosite-geolocation-!cn.srs'
          download_rule \
            https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-cn.srs \
            https://cdn.jsdelivr.net/gh/SagerNet/sing-geoip@rule-set/geoip-cn.srs \
            dist/rules/geoip-cn.srs
          sha256sum dist/rules/*.srs > dist/rules/SHA256SUMS.txt

      - name: 准备可携带 WebKitGTK 运行库
        run: |
          set -euo pipefail
          deb_dir="$RUNNER_TEMP/webkit-debs"
          extracted="$RUNNER_TEMP/webkit-extracted"
          mkdir -p "$deb_dir" "$extracted"
          cd "$deb_dir"
          apt-get download libwebkit2gtk-4.0-37 libjavascriptcoregtk-4.0-18 libicu70 libwoff1
          for deb in *.deb; do
            dpkg-deb -x "$deb" "$extracted"
          done
          mkdir -p "$RUNNER_TEMP/webkit-runtime/libs" "$RUNNER_TEMP/webkit-runtime/webkit"
          find "$extracted/usr/lib/aarch64-linux-gnu" -maxdepth 1 \( -type f -o -type l \) -name '*.so*' -exec cp -a {} "$RUNNER_TEMP/webkit-runtime/libs/" \;
          find "$extracted/usr/lib/aarch64-linux-gnu" -type f \( -name WebKitNetworkProcess -o -name WebKitWebProcess \) -exec cp -a {} "$RUNNER_TEMP/webkit-runtime/webkit/" \;
          test -e "$RUNNER_TEMP/webkit-runtime/libs/libwebkit2gtk-4.0.so.37"
          test -f "$RUNNER_TEMP/webkit-runtime/webkit/WebKitNetworkProcess"
          test -f "$RUNNER_TEMP/webkit-runtime/webkit/WebKitWebProcess"

      - name: 组装 Linux ARM64 便携版
        run: |
          set -euo pipefail
          rm -rf dist/sbtun-linux-arm64
          mkdir -p dist/sbtun-linux-arm64/resources
          cp build/bin/sbtun dist/sbtun-linux-arm64/sbtun
          go build -tags cli -o dist/sbtun-linux-arm64/sbtun-cli .
          sing_box=$(find "$RUNNER_TEMP/sing-box" -type f -name sing-box -executable | head -n 1)
          test -n "$sing_box"
          cp "$sing_box" dist/sbtun-linux-arm64/sing-box
          cp -r dist/rules dist/sbtun-linux-arm64/rules
          cp VERSION dist/sbtun-linux-arm64/VERSION
          cp resources/icon.png dist/sbtun-linux-arm64/resources/icon.png
          cp -r "$RUNNER_TEMP/webkit-runtime/libs" dist/sbtun-linux-arm64/libs
          cp -r "$RUNNER_TEMP/webkit-runtime/webkit" dist/sbtun-linux-arm64/webkit
          chmod +x dist/sbtun-linux-arm64/sbtun dist/sbtun-linux-arm64/sbtun-cli dist/sbtun-linux-arm64/sing-box
          cat > dist/sbtun-linux-arm64/start-sbtun.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/libs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export WEBKIT_EXEC_PATH="$HERE/webkit"
          export WEBKIT2_EXEC_PATH="$HERE/webkit"
          if [[ "${EUID:-$(id -u)}" -eq 0 ]]; then
            exec "$HERE/sbtun" "$@"
          fi
          if command -v pkexec >/dev/null 2>&1; then
            exec pkexec env \
              LD_LIBRARY_PATH="$LD_LIBRARY_PATH" \
              WEBKIT_EXEC_PATH="$WEBKIT_EXEC_PATH" \
              WEBKIT2_EXEC_PATH="$WEBKIT2_EXEC_PATH" \
              "$HERE/sbtun" "$@"
          fi
          if command -v sudo >/dev/null 2>&1; then
            exec sudo env \
              LD_LIBRARY_PATH="$LD_LIBRARY_PATH" \
              WEBKIT_EXEC_PATH="$WEBKIT_EXEC_PATH" \
              WEBKIT2_EXEC_PATH="$WEBKIT2_EXEC_PATH" \
              "$HERE/sbtun" "$@"
          fi
          printf '无法获取管理员权限，请安装 polkit 后重试，或手动使用 sudo 启动。\n' >&2
          exit 1
          EOF
          chmod +x dist/sbtun-linux-arm64/start-sbtun.sh
          printf 'sbtun Linux ARM64 便携版\n\n运行 ./start-sbtun.sh 启动 GUI，程序会自动请求管理员权限。\n命令行模式：./sbtun-cli help\nTUN 模式需要 root 或 CAP_NET_ADMIN 权限。\n\n内置 sing-box %s 和 WebKitGTK 4.0 运行库。\n' "$SING_BOX_VERSION" > dist/sbtun-linux-arm64/README.txt
          (cd dist/sbtun-linux-arm64 && find libs webkit -type f -exec sha256sum {} +; sha256sum sbtun sbtun-cli sing-box start-sbtun.sh) > dist/sbtun-linux-arm64/SHA256SUMS.txt

      - name: 打包 TAR.GZ
        run: tar -czf dist/sbtun-linux-arm64.tar.gz -C dist sbtun-linux-arm64

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: sbtun-linux-arm64
          path: dist/sbtun-linux-arm64.tar.gz
          if-no-files-found: error

      - name: 创建并上传 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/sbtun-linux-arm64.tar.gz --clobber
          else
            gh release create "$tag" dist/sbtun-linux-arm64.tar.gz --title "sbtun $tag" --generate-notes
          fi
