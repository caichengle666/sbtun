name: Windows 构建

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-amd64:
    runs-on: windows-latest
    env:
      SING_BOX_VERSION: 1.14.0
      WINTUN_VERSION: 0.14.1
      SING_BOX_SHA256: 3ffb56267da14e287be48bd10cf7e6505260125bad940b75101fbb4d5d58e5d6
      WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: ''

      - name: 安装 Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: 安装前端依赖
        shell: pwsh
        working-directory: frontend
        run: npm install

      - name: 整理 Go 依赖
        shell: pwsh
        run: go mod tidy

      - name: 构建 sbtun.exe
        shell: pwsh
        run: wails build -clean -platform windows/amd64

      - name: 下载并校验 sing-box
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\sing-box.zip"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$env:SING_BOX_VERSION/sing-box-$env:SING_BOX_VERSION-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:SING_BOX_SHA256) { throw "sing-box SHA256 校验失败: $hash" }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\sing-box" -Force

      - name: 下载并校验 Wintun
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\wintun.zip"
          $url = "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:WINTUN_SHA256) { throw "Wintun SHA256 校验失败: $hash" }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\wintun" -Force

      - name: 下载分流规则集
        shell: pwsh
        run: |
          $rules = "dist\rules"
          New-Item -ItemType Directory -Force -Path $rules | Out-Null
          $items = @{
            'geosite-geolocation-cn.srs' = 'https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-geolocation-cn.srs'
            'geosite-geolocation-!cn.srs' = 'https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-geolocation-!cn.srs'
            'geoip-cn.srs' = 'https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-cn.srs'
          }
          foreach ($item in $items.GetEnumerator()) {
            Invoke-WebRequest -Uri $item.Value -OutFile (Join-Path $rules $item.Key)
          }
          Get-ChildItem $rules -Filter *.srs | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name
          } | Set-Content dist\rules\SHA256SUMS.txt -Encoding ASCII

      - name: 组装便携版目录
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\sbtun | Out-Null
          Copy-Item build\bin\sbtun.exe dist\sbtun\sbtun.exe -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\sing-box" -Filter sing-box.exe -Recurse | Select-Object -First 1
          Copy-Item $exe.FullName dist\sbtun\sing-box.exe -Force
          Copy-Item "$env:RUNNER_TEMP\wintun\wintun\bin\amd64\wintun.dll" dist\sbtun\wintun.dll -Force
          Copy-Item dist\rules dist\sbtun\rules -Recurse -Force
          Copy-Item VERSION dist\sbtun\VERSION -Force
          @"
          sbtun Windows 便携版

          运行 sbtun.exe 即可启动桌面程序。
          TUN 模式需要管理员权限。

          内置组件：
          - sing-box $env:SING_BOX_VERSION
          - Wintun $env:WINTUN_VERSION
          - sing-box SRS 分流规则集
          "@ | Set-Content dist\sbtun\README.txt -Encoding UTF8
          (Get-FileHash dist\sbtun\sbtun.exe -Algorithm SHA256).Hash.ToLower() + '  sbtun.exe' | Set-Content dist\sbtun\SHA256SUMS.txt -Encoding ASCII
          (Get-FileHash dist\sbtun\sing-box.exe -Algorithm SHA256).Hash.ToLower() + '  sing-box.exe' | Add-Content dist\sbtun\SHA256SUMS.txt -Encoding ASCII
          (Get-FileHash dist\sbtun\wintun.dll -Algorithm SHA256).Hash.ToLower() + '  wintun.dll' | Add-Content dist\sbtun\SHA256SUMS.txt -Encoding ASCII

      - name: 打包 ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\sbtun\* -DestinationPath "dist\sbtun-windows-amd64.zip" -Force

      - name: 创建并上传 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist\sbtun-windows-amd64.zip --title "sbtun $tag" --generate-notes
          } else {
            gh release upload $tag dist\sbtun-windows-amd64.zip --clobber
          }
