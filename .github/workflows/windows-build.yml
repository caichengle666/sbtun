name: Windows 构建

on:
  push:
    branches: [main, codex/capture-linux-arm64]
    tags: ['v*', '0.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: ''

      - name: 安装 Wails
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          "$env:GOPATH\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: 安装前端依赖
        shell: pwsh
        working-directory: frontend
        run: npm install

      - name: 下载 Go 依赖
        shell: pwsh
        run: go mod download

      - name: 解析最新依赖版本
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Accept = 'application/vnd.github+json'; Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'sbtun-build' }
          $singRelease = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/SagerNet/sing-box/releases/latest'
          $singAsset = $singRelease.assets | Where-Object { $_.name -match "windows-$env:TARGET_ARCH\.zip$" } | Select-Object -First 1
          if (-not $singAsset) { throw "latest sing-box release 没有 Windows $env:TARGET_ARCH zip 资产" }
          $singDigest = $singAsset.digest
          if (-not $singDigest) { throw "latest sing-box asset 没有 SHA256 digest: $($singAsset.name)" }
          $wintunPage = Invoke-WebRequest -Uri 'https://www.wintun.net/'
          $wintunMatch = [regex]::Match($wintunPage.Content, 'builds/wintun-(?<version>[0-9.]+)\.zip')
          if (-not $wintunMatch.Success) { throw 'Wintun 官网没有找到最新构建包' }
          $singVersion = $singRelease.tag_name.TrimStart('v')
          $wintunVersion = $wintunMatch.Groups['version'].Value
          "SING_BOX_VERSION=$singVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SING_BOX_URL=$($singAsset.browser_download_url)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SING_BOX_SHA256=$($singDigest -replace '^sha256:', '')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINTUN_VERSION=$wintunVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINTUN_URL=https://www.wintun.net/builds/wintun-$wintunVersion.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "sing-box latest: $singVersion"
          Write-Host "Wintun latest: $wintunVersion"

      - name: 生成统一 Windows 图标
        shell: pwsh
        run: |
          if (Test-Path build\windows\icon.ico) { Move-Item build\windows\icon.ico "$env:RUNNER_TEMP\old-icon.ico" -Force }
          Copy-Item resources\icon.png build\appicon.png -Force

      - name: 构建 sbtun.exe
        shell: pwsh
        run: wails build -clean -platform windows/$env:TARGET_ARCH

      - name: 下载并校验 sing-box
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\sing-box.zip"
          Invoke-WebRequest -Uri $env:SING_BOX_URL -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:SING_BOX_SHA256) { throw "sing-box SHA256 校验失败: $hash" }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\sing-box" -Force

      - name: 下载并校验 Wintun
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest -Uri $env:WINTUN_URL -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\wintun" -Force

      - name: 下载分流规则集
        shell: pwsh
        run: |
          $rules = "dist\rules"
          New-Item -ItemType Directory -Force -Path $rules | Out-Null
          $items = @{
            'geosite-geolocation-cn.srs' = @(
              'https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-geolocation-cn.srs',
              'https://cdn.jsdelivr.net/gh/SagerNet/sing-geosite@rule-set/geosite-geolocation-cn.srs'
            )
            'geosite-geolocation-!cn.srs' = @(
              'https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-geolocation-%21cn.srs',
              'https://cdn.jsdelivr.net/gh/SagerNet/sing-geosite@rule-set/geosite-geolocation-%21cn.srs'
            )
            'geoip-cn.srs' = @(
              'https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-cn.srs',
              'https://cdn.jsdelivr.net/gh/SagerNet/sing-geoip@rule-set/geoip-cn.srs'
            )
          }
          foreach ($item in $items.GetEnumerator()) {
            $destination = Join-Path $rules $item.Key
            $downloaded = $false
            foreach ($url in $item.Value) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $destination -MaximumRetryCount 3 -RetryIntervalSec 2
                $downloaded = $true
                break
              } catch {
                Write-Warning "规则下载失败，尝试备用源: $url"
              }
            }
            if (-not $downloaded) {
              throw "规则下载失败: $($item.Key)"
            }
          }
          Get-ChildItem $rules -Filter *.srs | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name
          } | Set-Content dist\rules\SHA256SUMS.txt -Encoding ASCII

      - name: 组装便携版目录
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\sbtun | Out-Null
          Copy-Item build\bin\sbtun.exe dist\sbtun\sbtun.exe -Force
          $env:GOOS = 'windows'
          $env:GOARCH = $env:TARGET_ARCH
          go build -tags cli -o dist\sbtun\sbtun-cli.exe .
          $exe = Get-ChildItem "$env:RUNNER_TEMP\sing-box" -Filter sing-box.exe -Recurse | Select-Object -First 1
          Copy-Item $exe.FullName dist\sbtun\sing-box.exe -Force
          $singBoxDir = Split-Path $exe.FullName -Parent
          Get-ChildItem $singBoxDir -File | Where-Object { $_.Name -ne 'sing-box.exe' } | Copy-Item -Destination dist\sbtun -Force
          Copy-Item "$env:RUNNER_TEMP\wintun\wintun\bin\$env:TARGET_ARCH\wintun.dll" dist\sbtun\wintun.dll -Force
          Copy-Item dist\rules dist\sbtun\rules -Recurse -Force
          Copy-Item VERSION dist\sbtun\VERSION -Force
          New-Item -ItemType Directory -Force -Path dist\sbtun\resources | Out-Null
          Copy-Item resources\icon.png dist\sbtun\resources\icon.png -Force
          Copy-Item build\windows\icon.ico dist\sbtun\resources\sbtun.ico -Force
          @"
          sbtun Windows $env:TARGET_ARCH 便携版

          运行 sbtun.exe 启动桌面程序，或运行 sbtun-cli.exe help 查看命令行功能。
          TUN 模式需要管理员权限。

          内置组件：
          - sing-box $env:SING_BOX_VERSION
          - Wintun $env:WINTUN_VERSION
          - sing-box SRS 分流规则集
          "@ | Set-Content dist\sbtun\README.txt -Encoding UTF8
          (Get-FileHash dist\sbtun\sbtun.exe -Algorithm SHA256).Hash.ToLower() + '  sbtun.exe' | Set-Content dist\sbtun\SHA256SUMS.txt -Encoding ASCII
          (Get-FileHash dist\sbtun\sbtun-cli.exe -Algorithm SHA256).Hash.ToLower() + '  sbtun-cli.exe' | Add-Content dist\sbtun\SHA256SUMS.txt -Encoding ASCII
          (Get-FileHash dist\sbtun\sing-box.exe -Algorithm SHA256).Hash.ToLower() + '  sing-box.exe' | Add-Content dist\sbtun\SHA256SUMS.txt -Encoding ASCII
          (Get-FileHash dist\sbtun\wintun.dll -Algorithm SHA256).Hash.ToLower() + '  wintun.dll' | Add-Content dist\sbtun\SHA256SUMS.txt -Encoding ASCII

      - name: 打包 ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\sbtun\* -DestinationPath "dist\sbtun-windows-$env:TARGET_ARCH.zip" -Force

      - name: 上传构建产物
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sbtun-windows-${{ matrix.arch }}
          path: dist/sbtun-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 3

      - name: 创建并上传 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag "dist\sbtun-windows-$env:TARGET_ARCH.zip" --title "sbtun $tag" --generate-notes
          } else {
            gh release upload $tag "dist\sbtun-windows-$env:TARGET_ARCH.zip" --clobber
          }
